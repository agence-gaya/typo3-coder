name: CI
on: [push, pull_request]
jobs:
  ci:
    name: Tests with PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup PHP version ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "COMPOSER_CACHE_DIRECTORY=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.COMPOSER_CACHE_DIRECTORY }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-php-${{ matrix.php }}-composer-

      - name: Composer info
        run: composer info

      - name: Composer validate
        run: composer validate

      - name: Composer install
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Rector
        if: matrix.php == '8.2'
        run: composer coder:rector

      - name: Fractor
        run: composer coder:fractor

      - name: PHP CS Fixer
        run: composer coder:php-cs-fixer

      - name: PHP Lint
        run: composer coder:phplint

      - name: YAML Lint
        run: composer coder:yaml-lint

      - name: PHP Stan
        if: matrix.php == '8.2'
        run: composer coder:phpstan

      - name: Unit tests
        run: composer coder:tests:unit

      - name: Functional tests
        run: composer coder:tests:functional
